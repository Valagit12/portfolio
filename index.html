<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valareza Arezehgar – Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .project-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .hidden {
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      position: relative;
      list-style-position: inside;
    }

    .modal-content a {
      display: block;
      margin-top: 10px;
      color: #007bff;
      text-decoration: none;
    }

    .modal-content li {
      margin-bottom: 0.5em;
    }

    .modal-content a:hover {
      text-decoration: underline;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal.show {
      display: flex;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Valareza Arezehgar</h1>
      <nav class="nav">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="about" class="container section">
      <h2>About Me</h2>
      <p>Hi. I'm Vala.</p>
    </section>

    <section id="projects" class="container section">
      <h2>Projects</h2>
      <div class="projects-grid"></div>
    </section>

    <section id="contact" class="container section">
      <h2>Contact</h2>
      <p>Email: <a href="mailto:valareza.arezehgar@gmail.com">valareza.arezehgar@gmail.com</a></p>
      <p>Find me on <a href="https://www.linkedin.com/in/valareza-arezehgar/">LinkedIn</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 Valareza Arezehgar. All rights reserved.</p>
    </div>
  </footer>

  <div id="projectModal" class="modal hidden">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div id="modalLinks"></div>
    </div>
  </div>


  <div id="projectModal" class="modal hidden">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div id="modalLinks"></div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>

</html>
